name: Build 3DS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build .3dsx
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libraries
        # pkg.devkitpro.org sometimes answers CI runners with a 403; retry with backoff.
        run: |
          PAC=$(command -v dkp-pacman || command -v pacman)
          for i in 1 2 3 4 5; do
            $PAC -Sy --noconfirm --needed citro2d citro3d 3ds-mbedtls && exit 0
            echo "pacman failed (attempt $i/5), retrying in $((i * 20))s..."
            sleep $((i * 20))
          done
          exit 1

      - name: Build
        run: make -C 3ds

      - uses: actions/upload-artifact@v4
        with:
          name: firetv-remote-3dsx
          path: 3ds/firetv-remote.3dsx

      - uses: actions/upload-artifact@v4
        with:
          name: elf
          path: 3ds/firetv-remote.elf
          retention-days: 1

  cia:
    name: Package .cia
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: elf
          path: 3ds

      - name: Build makerom and bannertool
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q build-essential
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git /tmp/ctr
          make -C /tmp/ctr/makerom deps && make -C /tmp/ctr/makerom -j4
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/diasurgical/bannertool.git /tmp/bt
          make -C /tmp/bt -j4
          echo "MAKEROM=/tmp/ctr/makerom/bin/makerom" >> "$GITHUB_ENV"
          echo "BANNERTOOL=$(ls /tmp/bt/output/linux-*/bannertool)" >> "$GITHUB_ENV"

      - name: Package
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] && export APP_VERSION="$VER"
          3ds/cia/make_cia.sh 3ds/firetv-remote.elf 3ds/firetv-remote.cia

      - uses: actions/upload-artifact@v4
        with:
          name: firetv-remote-cia
          path: 3ds/firetv-remote.cia

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, cia]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: firetv-remote-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            firetv-remote.3dsx
            firetv-remote.cia
