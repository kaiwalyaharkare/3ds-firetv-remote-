name: Build 3DS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mbedtls portlib
        run: |
          PAC=$(command -v dkp-pacman || command -v pacman)
          $PAC -Sy --noconfirm --needed 3ds-mbedtls

      - name: Build
        run: make -C 3ds

      - name: Upload .3dsx
        uses: actions/upload-artifact@v4
        with:
          name: firetv-remote
          path: 3ds/firetv-remote.3dsx

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: 3ds/firetv-remote.3dsx
